<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L&amp;C Control</title>
    <!-- Mismo diseño que lc_lab/templates/control_base.html (Control original); backend: Supabase LC-Sync-QA -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
    <link rel="stylesheet" href="control.css">
</head>
<body>

<!-- ── LOGIN (control_login.html) ── -->
<div id="vistaLogin" class="login-wrap" hidden>
  <div class="login-card">
    <div class="brand-icon">L&amp;C</div>
    <h5 class="fw-bold text-center mb-1">Centro de mando</h5>
    <p class="text-center text-muted mb-4" style="font-size:.84rem">Ingresa tus credenciales de despacho</p>
    <div id="loginError" class="alert alert-danger d-flex align-items-center gap-2 py-2 mb-3" style="font-size:.85rem" hidden>
      <i class="bi bi-exclamation-triangle-fill"></i> <span></span>
    </div>
    <form id="loginForm" autocomplete="on">
      <div class="mb-3">
        <label class="form-label" for="loginEmail">Usuario (correo)</label>
        <input id="loginEmail" name="username" type="email" class="form-control"
               placeholder="despacho@empresa.com" autocomplete="username" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="loginPass">Contraseña</label>
        <input id="loginPass" name="password" type="password" class="form-control"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button id="loginBtn" class="btn btn-accent w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
      </button>
    </form>
    <p class="text-center text-muted mt-4 mb-0" style="font-size:.75rem">
      L&amp;C Services &nbsp;·&nbsp; Portal de gestión
    </p>
  </div>
</div>

<!-- ── APP (control_base.html) ── -->
<div id="vistaApp" hidden>
<div class="lc-overlay" id="lcOverlay"></div>

<aside class="lc-sidebar" id="lcSidebar">
    <div class="brand d-flex align-items-center gap-2">
        <div>
            <div class="brand-title">L&amp;C Control</div>
            <span class="brand-badge mt-1 d-inline-block">QA · ONLINE</span>
        </div>
    </div>
    <nav>
        <div class="nav-section">Principal</div>
        <a class="nav-link" data-nav="tablero" href="#/"><i class="bi bi-grid-1x2"></i> Tablero</a>
        <a class="nav-link" data-nav="nueva" href="#/nueva"><i class="bi bi-plus-circle"></i> Nueva Orden</a>
        <div class="nav-section">Gestión</div>
        <a class="nav-link" data-nav="clientes" href="#/clientes"><i class="bi bi-people"></i> Clientes</a>
        <a class="nav-link" data-nav="tecnicos" href="#/tecnicos"><i class="bi bi-tools"></i> Técnicos</a>
        <div class="nav-section">Configuración</div>
        <a class="nav-link" data-nav="config" href="#/config"><i class="bi bi-currency-dollar"></i> Precios</a>
        <a class="nav-link" data-nav="listas" href="#/listas"><i class="bi bi-list-check"></i> Listas editables</a>
        <a class="nav-link" data-nav="plantillas" href="#/plantillas"><i class="bi bi-file-earmark-text"></i> Plantillas de propuesta</a>
    </nav>
    <div class="sidebar-footer">
        <div class="d-flex align-items-center gap-2">
            <div class="avatar" id="sbAvatar" style="width:28px;height:28px;font-size:.75rem;">U</div>
            <div>
                <div id="sbNombre" style="font-size:.78rem;font-weight:600;color:#1a1d2e;">Usuario</div>
                <div id="sbRol" style="font-size:.7rem;color:var(--text-muted);"></div>
            </div>
        </div>
        <div id="rtEstado" class="mt-2" style="font-size:.7rem;"><i class="bi bi-circle-fill text-secondary" style="font-size:.5rem"></i> Tiempo real…</div>
    </div>
</aside>

<div class="lc-main">
    <header class="lc-header">
        <div class="d-flex align-items-center gap-3">
            <button class="hamburger icon-btn border-0" id="btnMenu" aria-label="Menú">
                <i class="bi bi-list" style="font-size:1.2rem;"></i>
            </button>
            <div class="header-left">
                <h1 id="pageTitle">Dashboard</h1>
                <p id="pageSubtitle"></p>
            </div>
        </div>
        <div class="header-right">
            <a href="#" class="icon-btn position-relative" id="btnNotif" title="Notificaciones">
                <i class="bi bi-bell"></i>
                <span id="notifBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:.6rem" hidden>0</span>
            </a>
            <a href="#" class="icon-btn" id="btnSalir" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></a>
            <div class="avatar" id="hdAvatar">U</div>
        </div>
    </header>
    <div id="notifPanel" class="lc-card notif-panel" hidden></div>
    <div class="lc-alerts px-4 pt-3" id="lcAlerts"></div>
    <div class="lc-body" id="lcBody"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"
        integrity="sha384-/E7xfJz9bbCsrwJAbrt9CO5JB1REPVQjuSrQT4Cpz2BQBocDVsGLB2/VMAEzYaf+" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"
        integrity="sha384-lQXOAyZwHXE55JFyrOMB7nY2Wv+m5ZWNtJcHrd1rceRQXAYNLak8ukN5TjBTcIwz" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
