<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L&amp;C Control QA</title>
<!-- Consola de despacho QA: Supabase LC-Sync-QA (Auth + lc-api + Realtime). Sin Flask.
     config.js (no versionado) define window.LC_QA = { url, publishableKey } — ver config.example.js -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js"></script>
<style>
/* Layout: barra de sesión arriba; a la izquierda la cola de órdenes, a la derecha el detalle/acciones. Una columna en móvil. */
:root {
  --bg: #f3f5f4; --panel: #ffffff; --fg: #18211e; --muted: #5d6b66; --line: #d6dedb;
  --accent: #0f6b5c; --accent-fg: #ffffff; --warn: #a15c00; --bad: #b3261e; --ok: #1f7a3a;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111816; --panel: #19221f; --fg: #e4ece9; --muted: #95a59f; --line: #2c3834;
  --accent: #4fc2ad; --accent-fg: #06201b; --warn: #f0b35a; --bad: #ff8a80; --ok: #7bd88f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111816; --panel: #19221f; --fg: #e4ece9; --muted: #95a59f; --line: #2c3834;
  --accent: #4fc2ad; --accent-fg: #06201b; --warn: #f0b35a; --bad: #ff8a80; --ok: #7bd88f; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }  /* main/section usan display:grid; hidden debe ganar */
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 32px }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; padding-block: 4px 12px; border-bottom: 1px solid var(--line) }
h1 { font-size: 18px; margin: 0; letter-spacing: .02em }
h1 small { color: var(--muted); font-weight: 400; font-family: var(--mono); font-size: 12px; margin-left: 6px }
.status { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block }
.dot.live { background: var(--ok) } .dot.off { background: var(--bad) }
main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; margin-top: 16px }
@media (max-width: 820px) { main { grid-template-columns: 1fr } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0 }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px }
form { display: grid; gap: 8px }
label { font-size: 12px; color: var(--muted); display: grid; gap: 3px }
input, select, textarea { width: 100%; min-width: 0 }
input, select, textarea, button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px }
button { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); cursor: pointer; font-weight: 600 }
button.secondary { background: transparent; color: var(--fg); border-color: var(--line); font-weight: 400 }
button:disabled { opacity: .5; cursor: default }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end }
.row > * { flex: 1 1 140px; min-width: 0 }
table { width: 100%; border-collapse: collapse; font-size: 14px }
.tablewrap { overflow-x: auto }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 6px }
td { border-bottom: 1px solid var(--line); padding: 7px 6px; vertical-align: top }
tr.order { cursor: pointer } tr.order:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent) }
tr.sel td { background: color-mix(in srgb, var(--accent) 14%, transparent) }
tr.flash td { animation: flash 1.2s ease-out }
@keyframes flash { from { background: color-mix(in srgb, var(--warn) 30%, transparent) } }
@media (prefers-reduced-motion: reduce) { tr.flash td { animation: none } }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.chip { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 2px 7px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap }
.e-PENDIENTE { color: var(--warn) } .e-COMPLETADO { color: var(--ok) } .e-CANCELADO { color: var(--bad) }
.e-curso { color: var(--accent) }
.muted { color: var(--muted) } .err { color: var(--bad); min-height: 1.2em; font-size: 13px } .okmsg { color: var(--ok); font-size: 13px }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0 0 12px; font-size: 14px }
dt { color: var(--muted) } dd { margin: 0; overflow-wrap: anywhere }
#log { font-family: var(--mono); font-size: 12px; color: var(--muted); max-height: 160px; overflow: auto; white-space: pre-wrap; margin: 0 }
.stack { display: grid; gap: 16px }
</style>
</head>
<body>
<header>
  <h1>L&amp;C Control <small>QA · LC-Sync-QA</small></h1>
  <div class="status"><span><span class="dot" id="rtDot"></span> <span id="rtTxt">Realtime desconectado</span></span>
    <span id="who"></span><button class="secondary" id="logout" hidden>Salir</button></div>
</header>

<section id="loginBox" style="max-width:420px;margin-top:16px">
  <h2>Entrar como despacho</h2>
  <form id="loginForm">
    <label for="email">Correo<input id="email" type="email" autocomplete="username" required></label>
    <label for="pass">Contraseña<input id="pass" type="password" autocomplete="current-password" required></label>
    <button id="loginBtn">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<main id="app" hidden>
  <section>
    <h2>Órdenes <span class="muted" id="count"></span></h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Nº</th><th>Estado</th><th>Cliente / problema</th><th>Técnico</th><th>v</th></tr></thead>
      <tbody id="orders"><tr><td colspan="5" class="muted">Cargando órdenes…</td></tr></tbody>
    </table></div>
  </section>
  <div class="stack">
    <section>
      <h2>Orden seleccionada</h2>
      <div id="detail" class="muted">Elige una orden de la lista para asignarla o cambiar su estado.</div>
    </section>
    <section>
      <h2>Nueva orden</h2>
      <form id="newForm">
        <label for="nCliente">Cliente<input id="nCliente" required maxlength="200"></label>
        <label for="nDir">Dirección<input id="nDir" maxlength="400"></label>
        <label for="nDesc">Problema<textarea id="nDesc" rows="2" required maxlength="4000"></textarea></label>
        <button id="newBtn">Crear orden</button>
        <div class="err" id="newErr"></div>
      </form>
    </section>
    <section><h2>Actividad</h2><pre id="log"></pre></section>
  </div>
</main>

<script>
(() => {
  const cfg = window.LC_QA || {};
  const $ = (id) => document.getElementById(id);
  const log = (m) => { const t = new Date().toLocaleTimeString(); $("log").textContent = `${t} ${m}\n` + $("log").textContent; };
  if (!cfg.url || !cfg.publishableKey || !window.supabase) {
    $("loginErr").textContent = "Falta config.js (url y clave publicable de LC-Sync-QA).";
    $("loginBtn").disabled = true; return;
  }
  const sb = window.supabase.createClient(cfg.url, cfg.publishableKey);
  const API = cfg.url + "/functions/v1/lc-api";
  const ESTADOS = ["PENDIENTE","EN RUTA","LLEGUÉ","EN REPARACIÓN","ESPERANDO APROBACIÓN","PART HOLD","PAUSADO","COMPLETADO","CANCELADO"];
  let device; try { device = localStorage.getItem("lcqa.device"); } catch {}
  if (!device) { device = "control-web-" + crypto.randomUUID().slice(0, 8); try { localStorage.setItem("lcqa.device", device); } catch {} }

  const jobs = new Map(); let techs = []; let selected = null; let lastMsg = null;  // mensaje del último guardado; sobrevive al repintado por Realtime let maxUpdated = 0; let channel = null;

  async function api(method, path, body) {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(API + path, { method, headers: { "content-type": "application/json",
      apikey: cfg.publishableKey, authorization: "Bearer " + (session?.access_token || "") },
      body: body ? JSON.stringify(body) : undefined });
    let j = null; try { j = await r.json(); } catch {}
    return { status: r.status, body: j };
  }

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const chipClass = (e) => ["PENDIENTE","COMPLETADO","CANCELADO"].includes(e) ? "e-" + e : "e-curso";
  const techName = (j) => j.technician_code || (j.technician_id ? "asignado" : "—");

  function upsert(row, fromRealtime) {
    const prev = jobs.get(row.id);
    if (prev && prev.version > row.version) return;  // un evento atrasado nunca pisa una versión nueva
    jobs.set(row.id, row);
    maxUpdated = Math.max(maxUpdated, row.updated_at || 0);
    render(fromRealtime ? row.id : null);
  }

  function render(flashId) {
    const rows = [...jobs.values()].sort((a, b) => b.updated_at - a.updated_at);
    $("count").textContent = `· ${rows.length}`;
    $("orders").innerHTML = rows.length ? rows.map((j) => `
      <tr class="order${j.id === selected ? " sel" : ""}${j.id === flashId ? " flash" : ""}" data-id="${j.id}">
        <td class="num">${j.id}</td><td><span class="chip ${chipClass(j.estado)}">${esc(j.estado)}</span></td>
        <td><b>${esc(j.cliente)}</b><br><span class="muted">${esc(j.descripcion).slice(0, 90)}</span></td>
        <td class="num">${esc(techName(j))}</td><td class="num">${j.version}</td></tr>`).join("")
      : `<tr><td colspan="5" class="muted">No hay órdenes todavía. Crea una o espera a que un cliente la envíe.</td></tr>`;
    if (selected && jobs.has(selected)) renderDetail();
  }

  function renderDetail() {
    const j = jobs.get(selected);
    $("detail").classList.remove("muted");
    $("detail").innerHTML = `
      <dl><dt>Nº</dt><dd class="num">${j.id} · versión ${j.version}</dd>
        <dt>Cliente</dt><dd>${esc(j.cliente)}${j.telefono ? " · " + esc(j.telefono) : ""}</dd>
        <dt>Dirección</dt><dd>${esc(j.direccion) || "—"}</dd><dt>Problema</dt><dd>${esc(j.descripcion)}</dd>
        <dt>Origen</dt><dd>${esc(j.origin)}</dd><dt>Despacho</dt><dd>${esc(j.estado_dispatch) || "—"}</dd>
        <dt>Notas</dt><dd>${esc(j.notas) || "—"}</dd></dl>
      <form id="actForm">
        <div class="row">
          <label for="aTech">Técnico<select id="aTech"><option value="">Sin asignar</option>${techs.map((t) =>
            `<option value="${t.id}"${t.id === j.technician_id ? " selected" : ""}>${esc(t.technician_code)} · ${esc(t.display_name)}</option>`).join("")}</select></label>
          <label for="aEstado">Estado<select id="aEstado">${ESTADOS.map((e) => `<option${e === j.estado ? " selected" : ""}>${e}</option>`).join("")}</select></label>
        </div>
        <label for="aNotas">Notas<textarea id="aNotas" rows="2">${esc(j.notas || "")}</textarea></label>
        <button id="actBtn">Guardar cambios</button><div id="actMsg" class="${lastMsg?.ok ? "okmsg" : "err"}">${esc(lastMsg?.id === j.id ? lastMsg.text : "")}</div>
      </form>`;
    $("actForm").addEventListener("submit", save);
  }

  async function save(ev) {
    ev.preventDefault();
    const j = jobs.get(selected); const body = { version: j.version, device, updatedAt: Date.now() };
    const tech = $("aTech").value || null, estado = $("aEstado").value, notas = $("aNotas").value;
    if (tech !== (j.technician_id || null)) { body.technician_id = tech; body.estado_dispatch = tech ? "ASIGNADO" : "SIN ASIGNAR"; }
    if (estado !== j.estado) body.estado = estado;
    if (notas !== (j.notas || "")) body.notas = notas;
    if (Object.keys(body).length === 3) { $("actMsg").textContent = "No hay cambios que guardar."; return; }
    $("actBtn").disabled = true;
    const r = await api("PATCH", "/orders/" + j.id, body);
    $("actBtn").disabled = false;
    if (r.status === 200) { lastMsg = { id: j.id, ok: true, text: `Guardado · versión ${r.body.version}` }; $("actMsg").className = "okmsg"; $("actMsg").textContent = lastMsg.text;
      log(`orden ${j.id} → v${r.body.version} ${JSON.stringify(body)}`); await refresh(j.id); }
    else if (r.status === 409) { $("actMsg").className = "err";
      lastMsg = { id: j.id, ok: false, text: `Otro usuario cambió ${(r.body?.conflictFields || []).join(", ") || "la orden"}. Se recargó la versión actual; revisa y guarda de nuevo.` };
      $("actMsg").textContent = lastMsg.text;
      log(`orden ${j.id} CONFLICT ${JSON.stringify(r.body)}`); await refresh(j.id); }
    else { $("actMsg").className = "err"; $("actMsg").textContent = `No se guardó (${r.status} ${r.body?.error || ""}).`; log(`orden ${j.id} HTTP ${r.status} ${JSON.stringify(r.body)}`); }
  }

  async function refresh(id) { const r = await api("GET", "/orders/" + id); if (r.status === 200) upsert(r.body); }

  async function pull(since) {
    const r = await api("GET", "/orders" + (since ? "?since=" + since : ""));
    if (r.status !== 200) { log(`lista HTTP ${r.status}`); return; }
    r.body.forEach((row) => upsert(row));
    if (!r.body.length && !jobs.size) render();
  }

  function startRealtime(token) {
    sb.realtime.setAuth(token);
    channel = sb.channel("control-jobs")
      .on("postgres_changes", { event: "*", schema: "public", table: "jobs" }, (p) => {
        if (p.new && p.new.id) { upsert(p.new, true); log(`realtime ${p.eventType} orden ${p.new.id} v${p.new.version} ${p.new.estado}`); }
      })
      .subscribe((st) => {
        const live = st === "SUBSCRIBED";
        $("rtDot").className = "dot " + (live ? "live" : "off");
        $("rtTxt").textContent = live ? "Realtime conectado" : "Realtime: " + st.toLowerCase();
        if (live) pull(Math.max(0, maxUpdated - 5000));  // recupera lo cambiado mientras estuvo desconectado
      });
  }

  async function enter(session) {
    const me = await api("GET", "/auth/me");
    if (me.status !== 200 || !["DISPATCHER", "ADMIN"].includes(me.body?.role)) {
      await sb.auth.signOut();
      $("loginErr").textContent = me.status === 200 ? "Esta consola es solo para despacho." : "No se pudo verificar tu cuenta.";
      return;
    }
    $("loginBox").hidden = true; $("app").hidden = false; $("logout").hidden = false;
    $("who").textContent = `${session.user.email} · ${me.body.role}`;
    const t = await api("GET", "/technicians"); techs = t.status === 200 ? t.body : [];
    await pull(0); startRealtime(session.access_token);
    log(`sesión ${me.body.role} · ${techs.length} técnicos · dispositivo ${device}`);
  }

  $("orders").addEventListener("click", (e) => { const tr = e.target.closest("tr.order"); if (tr) { selected = Number(tr.dataset.id); lastMsg = null; render(); } });
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault(); $("loginErr").textContent = ""; $("loginBtn").disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
    $("loginBtn").disabled = false;
    if (error) { $("loginErr").textContent = "Correo o contraseña incorrectos."; return; }
    $("pass").value = ""; enter(data.session);
  });
  $("newForm").addEventListener("submit", async (e) => {
    e.preventDefault(); $("newBtn").disabled = true; $("newErr").textContent = "";
    const reqId = $("newForm").dataset.req || ($("newForm").dataset.req = crypto.randomUUID());  // mismo id si se reintenta
    const r = await api("POST", "/orders", { request_id: reqId, cliente: $("nCliente").value, descripcion: $("nDesc").value, direccion: $("nDir").value });
    $("newBtn").disabled = false;
    if (r.status === 201 || r.status === 200) { delete $("newForm").dataset.req; $("newForm").reset(); log(`orden ${r.body.id} creada${r.body.replay ? " (reintento, sin duplicar)" : ""}`); refresh(r.body.id); }
    else $("newErr").textContent = `No se creó (${r.status} ${r.body?.error || "sin conexión"}). Pulsa de nuevo para reintentar sin duplicar.`;
  });
  $("logout").addEventListener("click", async () => { if (channel) sb.removeChannel(channel); await sb.auth.signOut(); location.reload(); });
  sb.auth.onAuthStateChange((ev, s) => { if (ev === "TOKEN_REFRESHED" && s) sb.realtime.setAuth(s.access_token); });
  sb.auth.getSession().then(({ data }) => { if (data.session) enter(data.session); });
})();
</script>
</body>
</html>
