<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LC Technician — Acceso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3e;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --red: #ef4444;
      --red-dark: #dc2626;
      --yellow: #f59e0b;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }
    .logo-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .logo-sub {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.3rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.15s;
      outline: none;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--red);
    }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .remember-row input[type="checkbox"] {
      accent-color: var(--red);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .remember-row label {
      margin: 0;
      font-size: 0.85rem;
      text-transform: none;
      letter-spacing: 0;
      color: var(--muted);
      cursor: pointer;
    }
    .btn-login {
      width: 100%;
      padding: 0.85rem;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-login:hover { background: var(--red-dark); }
    .error-msg {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      text-align: center;
    }
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0 1rem;
    }
    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.72rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <span class="logo-icon">⚡</span>
      <div class="logo-title">LC Technician</div>
      <div class="logo-sub">Panel de administración</div>
    </div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username"
               value="{{ request.form.get('username', '') }}"
               placeholder="admin" autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="remember-row">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Recordarme 30 días</label>
      </div>
      <button type="submit" class="btn-login">Ingresar</button>
    </form>

    <hr class="divider">
    <p class="footer-note" style="margin-bottom:0.5rem;">Demo: <code>admin/lc2026</code> · <code>dispatcher/disp2026</code> · <code>viewer/view2026</code></p>
    <p class="footer-note">Usuarios en <code>server/users.json</code></p>
  </div>
</body>
</html>
