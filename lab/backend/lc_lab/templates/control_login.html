{% extends "control_base.html" %}{% block body %}
<h2>Centro de mando</h2><form method="post" style="display:grid;gap:10px;max-width:360px">
<input name="username" placeholder="Usuario" autocomplete="username" required>
<input name="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
<button>Entrar</button>{% if error %}<div class="err">{{error}}</div>{% endif %}</form>{% endblock %}
