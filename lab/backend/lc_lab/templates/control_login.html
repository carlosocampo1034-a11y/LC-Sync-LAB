<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L&C Control — Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    :root { --accent: #dc3545; --bg: #f0f2f8; }
    body { background: var(--bg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .login-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .login-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(26,29,46,.10);
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 400px;
    }
    .brand-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.25rem; font-weight: 800;
      margin: 0 auto 20px;
      box-shadow: 0 4px 14px rgba(220,53,69,.35);
    }
    .btn-accent {
      background: var(--accent); color: #fff; border: none;
      border-radius: 10px; padding: 11px; font-weight: 600;
      transition: background .15s;
    }
    .btn-accent:hover { background: #b02a37; color: #fff; }
    .form-control {
      border-radius: 10px; border-color: #e8eaf0;
      padding: 10px 14px; font-size: .92rem;
    }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(220,53,69,.12); }
    .form-label { font-size: .82rem; font-weight: 600; color: #555; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand-icon">L&C</div>
    <h5 class="fw-bold text-center mb-1">Centro de mando</h5>
    <p class="text-center text-muted mb-4" style="font-size:.84rem">Ingresa tus credenciales de despacho</p>

    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2 mb-3" style="font-size:.85rem">
      <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
    </div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input name="username" type="text" class="form-control"
               placeholder="admin_lab" autocomplete="username" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <input name="password" type="password" class="form-control"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn btn-accent w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
      </button>
    </form>

    <p class="text-center text-muted mt-4 mb-0" style="font-size:.75rem">
      L&C Services &nbsp;·&nbsp; Portal de gestión
    </p>
  </div>
</div>
</body>
</html>
