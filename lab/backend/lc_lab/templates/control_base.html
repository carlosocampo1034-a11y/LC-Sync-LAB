<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L&amp;C Control · Laboratorio</title>
<style>
:root{--rojo:#EB1700;--txt:#191919;--sec:#6b6b6b;--borde:#e5e5e5;--fondo:#fff;--suave:#f6f6f6;--ok:#137333}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;color:var(--txt);background:var(--fondo)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--borde)}
header b{font-size:18px}.lab{background:#fff3cd;color:#7a5b00;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:8px}
main{padding:16px;max-width:1100px;margin:auto}a{color:var(--rojo)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.tab{padding:8px 14px;border:1px solid var(--borde);border-radius:20px;text-decoration:none;color:var(--txt);white-space:nowrap}
.tab.on{border:2px solid var(--txt);font-weight:600}.n{background:var(--suave);border-radius:10px;padding:0 6px;margin-left:4px;font-size:12px}
.card{border:1px solid var(--borde);border-radius:14px;padding:14px;margin:10px 0;display:block;text-decoration:none;color:inherit}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.sec{color:var(--sec);font-size:14px}
.badge{background:var(--rojo);color:#fff;font-weight:700;font-size:12px;padding:3px 8px;border-radius:4px}
.badge.ok{background:var(--ok)}form.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--borde);border-radius:10px;background:var(--suave)}
button{font:inherit;font-weight:700;background:var(--rojo);color:#fff;border:0;border-radius:24px;padding:10px 18px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--borde);padding:6px;text-align:left;vertical-align:top}
.msg{background:var(--suave);padding:10px;border-radius:10px}.err{color:var(--rojo)}
</style></head><body>
<header><div><b>L&amp;C Control</b><span class="lab">LABORATORIO · datos ficticios</span></div>
{% if u %}<nav class="sec"><a href="{{url_for('control.tablero')}}">Tablero</a> · <a href="{{url_for('control.clientes')}}">Clientes</a> · <a href="{{url_for('control.tecnicos')}}">Técnicos</a> ·
{{u['display_name']}} · <a href="{{url_for('control.logout')}}">Salir</a></nav>{% endif %}</header>
<main>{% block body %}{% endblock %}</main></body></html>
