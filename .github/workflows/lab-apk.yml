name: LAB APK (debug)
# Compila las APK de QA (debug) de Technician y Customer en una sola ejecución.
# Firma: clave LAB permanente desde los secretos LAB_KEYSTORE_B64 y LAB_KEYSTORE_PASS
# (nunca en el repositorio ni en los artefactos). Sin otros secretos de producción.
on:
  workflow_dispatch:
  push:
    branches: [qa/hermes-lab-build]
permissions:
  contents: read
concurrency:
  group: lab-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK de Android (el del runner; setup-android@v3 falla por el paquete 'tools')
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          SDKM=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || "$SDKM" "platforms;android-36" >/dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms" | tail -4
      - name: Firma LAB permanente (desde secretos, nunca en el repo)
        env:
          KS_B64: ${{ secrets.LAB_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.LAB_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::falta el secreto LAB_KEYSTORE_B64"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lab-release.p12"
          printf 'KEYSTORE_FILE=%s\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=lclab\nKEY_PASSWORD=%s\n' \
            "$RUNNER_TEMP/lab-release.p12" "$KS_PASS" "$KS_PASS" > local.properties
          chmod 600 local.properties "$RUNNER_TEMP/lab-release.p12"
          cp local.properties customer_app/local.properties   # Customer es un proyecto Gradle aparte
          chmod 600 customer_app/local.properties
          echo "firma configurada (contenido no impreso)"
      - name: Firebase (google-services.json desde el secreto; nunca en el repo)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GS_B64" ]; then echo "::warning::sin GOOGLE_SERVICES_JSON_B64: se compila sin push"; exit 0; fi
          echo "$GS_B64" | base64 -d > app/google-services.json
          chmod 600 app/google-services.json
          echo "google-services.json configurado (contenido no impreso)"
      - name: Quitar el override de aapt2 del entorno Termux (solo en el runner)
        run: |
          # gradle.properties apunta aapt2 a una ruta de Termux/PRoot que no existe en el runner
          # y rompe processDebugResources. No se toca el archivo del repo: sólo la copia efímera.
          sed -i '/aapt2FromMavenOverride/d' gradle.properties customer_app/gradle.properties 2>/dev/null || true
          grep -c aapt2FromMavenOverride gradle.properties || echo "0 overrides en el runner"
      - name: Pruebas unitarias JVM (política de sync, estados, reglas)
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Technician (debug, applicationId com.lc.technician.dev)
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Customer (debug, applicationId com.lc.customer.lab)
        working-directory: customer_app
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: URL y clave anónima de Supabase LAB para QA (solo anon; nunca service_role)
        id: qa
        env:
          SB_URL: ${{ secrets.QA_SUPABASE_URL }}
          SB_ANON: ${{ secrets.QA_SUPABASE_ANON_KEY }}
        run: |
          # Sin los secretos QA se omiten las variantes QA y la compilación LAB sigue igual que antes.
          if [ -z "$SB_URL" ] || [ -z "$SB_ANON" ]; then echo "::warning::sin QA_SUPABASE_URL / QA_SUPABASE_ANON_KEY: se omite QA"; exit 0; fi
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SB_URL" "$SB_ANON" >> local.properties
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SB_URL" "$SB_ANON" >> customer_app/local.properties
          echo "Supabase QA configurado (contenido no impreso)"
          echo "enabled=1" >> "$GITHUB_OUTPUT"
      - name: Technician QA (applicationId com.lc.technician.qa)
        if: steps.qa.outputs.enabled == '1'
        run: ./gradlew --no-daemon --stacktrace assembleQa
      - name: Customer QA (applicationId com.lc.customer.qa)
        if: steps.qa.outputs.enabled == '1'
        working-directory: customer_app
        run: ./gradlew --no-daemon --stacktrace assembleQa
      - name: Verificar APK QA (applicationId, firma, SHA-256, sin secretos)
        if: steps.qa.outputs.enabled == '1'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for spec in "app/build/outputs/apk/qa:com.lc.technician.qa" "customer_app/app/build/outputs/apk/qa:com.lc.customer.qa"; do
            dir=${spec%%:*}; want=${spec##*:}; apk=$(ls "$dir"/*.apk | head -1)
            got=$("$BT/aapt2" dump packagename "$apk")
            echo "$apk -> $got"; [ "$got" = "$want" ] || { echo "::error::applicationId $got != $want"; exit 1; }
            sig=$("$BT/apksigner" verify --verbose --print-certs "$apk" 2>&1) || { echo "$sig"; echo "::error::firma invalida en $apk"; exit 1; }
            echo "$sig" | grep -E 'Verified using|certificate (DN|SHA-256)' || echo "$sig" | head -20
            sha256sum "$apk"
            unzip -p "$apk" 'classes*.dex' | strings | grep -qiE 'sb_secret_|service_role' && { echo "::error::secreto en $apk"; exit 1; } || true
            unzip -p "$apk" 'classes*.dex' | strings | grep -q 'zzbplbkrcdxmegoisxtf' || { echo "::error::$apk no apunta a LC-Sync-QA"; exit 1; }
            unzip -p "$apk" 'classes*.dex' | strings | grep -qE 'rmkduyrrjtqqvjpqhyra|10\.0\.0\.121' && echo "::warning::$apk contiene referencias LAB (codigo de otras variantes)" || true
          done
      - name: Resumen de APKs
        run: |
          find . -name "*.apk" \( -path "*debug*" -o -path "*/qa/*" \) -printf "%p %s bytes\n" | tee apks.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lab-apks
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            customer_app/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/qa/*.apk
            customer_app/app/build/outputs/apk/qa/*.apk

  sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias del backend LAB
        run: pip install flask
      - name: Pruebas de integridad de sincronización (32 comprobaciones)
        run: python lab/tests_sync/test_conflictos.py
