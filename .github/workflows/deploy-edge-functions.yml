name: Deploy Supabase Edge Functions

on:
  # Manual trigger only — never auto-deploys from feature branches.
  # To deploy: GitHub → Actions → Deploy Supabase Edge Functions → Run workflow.
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "lab"
        type: choice
        options: [lab]
      run_migration:
        description: "Run DB migration (supabase db push)"
        required: true
        default: "false"
        type: choice
        options: ["true", "false"]
      confirm:
        description: "Type 'deploy' to confirm"
        required: true
        type: string

jobs:
  safety-check:
    runs-on: ubuntu-latest
    steps:
      - name: Reject if confirmation missing
        if: inputs.confirm != 'deploy'
        run: |
          echo "ERROR: confirmation input must be 'deploy'. Got: '${{ inputs.confirm }}'"
          exit 1

  deploy:
    needs: safety-check
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_PROJECT_REF: rmkduyrrjtqqvjpqhyra
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify branch is feature/customer-visual-v2 (not main — requires PR review)
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          echo "Deploying from branch: $BRANCH"
          if [ "$BRANCH" = "main" ]; then
            echo "ERROR: direct deploy from main not allowed. Open a PR from feature branch."
            exit 1
          fi

      - name: Audit secrets present
        run: |
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && echo "SUPABASE_ACCESS_TOKEN missing" && exit 1
          echo "Secrets verified OK"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: Run migration (optional)
        if: inputs.run_migration == 'true'
        run: supabase db push --linked
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy lc-auth (no JWT verification — public endpoint)
        run: supabase functions deploy lc-auth --no-verify-jwt

      - name: Deploy lc-customer
        run: supabase functions deploy lc-customer

      - name: Deploy lc-dispatch
        run: supabase functions deploy lc-dispatch

      - name: Deploy lc-sync
        run: supabase functions deploy lc-sync

      - name: Smoke test — lc-auth rejects bad credentials with 401
        run: |
          BASE="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/lc-auth" \
            -H "Content-Type: application/json" \
            -d '{"email":"__smoke__@invalid.test","password":"x"}')
          echo "lc-auth smoke status: $STATUS"
          [ "$STATUS" = "401" ] || [ "$STATUS" = "400" ] || (echo "FAIL: unexpected $STATUS" && exit 1)

      - name: Smoke test — lc-customer rejects missing token with 401
        run: |
          BASE="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/lc-customer/jobs")
          echo "lc-customer smoke status: $STATUS"
          [ "$STATUS" = "401" ] || (echo "FAIL: unexpected $STATUS" && exit 1)

      - name: Smoke test — lc-dispatch rejects missing token with 401
        run: |
          BASE="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/lc-dispatch/jobs")
          echo "lc-dispatch smoke status: $STATUS"
          [ "$STATUS" = "401" ] || (echo "FAIL: unexpected $STATUS" && exit 1)

      - name: Smoke test — lc-sync rejects missing token with 401
        run: |
          BASE="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/lc-sync/pull")
          echo "lc-sync smoke status: $STATUS"
          [ "$STATUS" = "401" ] || (echo "FAIL: unexpected $STATUS" && exit 1)

      - name: Deploy summary
        run: |
          echo "=== DEPLOY COMPLETE ==="
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Functions: lc-auth, lc-customer, lc-dispatch, lc-sync"
          echo "Migration ran: ${{ inputs.run_migration }}"
          echo "Base URL: https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/"
