plugins { id 'com.android.application' }

// Misma clave LAB que Technician (llega por local.properties en CI; en local no existe y se usa
// el debug normal). Sin claves ni contraseñas en el repositorio.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) { localProps.load(new FileInputStream(localPropsFile)) }

// L&C Customer — LABORATORIO. Identificador propio: nunca com.lc.technician ni com.lc.technician.dev.
android {
    namespace 'com.lc.customer'
    compileSdk 36
    defaultConfig {
        applicationId "com.lc.customer.lab"
        minSdk 24
        targetSdk 36
        versionCode 11
        versionName "0.6.1"
        buildConfigField "String", "API_BASE", "\"http://127.0.0.1:5055/api/v2\""
        // Vacío fuera de QA: LAB y release siguen hablando con el backend de laboratorio.
        buildConfigField "String", "SUPABASE_URL", "\"\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"\""
    }
    signingConfigs {
        release {
            storeFile file(localProps['KEYSTORE_FILE'] ?: 'keystore_not_configured.jks')
            storePassword localProps['KEYSTORE_PASSWORD'] ?: ''
            keyAlias localProps['KEY_ALIAS'] ?: ''
            keyPassword localProps['KEY_PASSWORD'] ?: ''
        }
    }
    buildTypes {
        // QA aislada: com.lc.customer.qa (ver androidComponents abajo), sin HTTP en claro ni backend Flask.
        qa {
            initWith debug
            versionNameSuffix '-qa'
            matchingFallbacks = ['debug']
            buildConfigField "String", "API_BASE", "\"\""
            // Supabase LC-Sync-QA: solo URL y clave publicable (la sesión es la de cada cliente).
            buildConfigField "String", "SUPABASE_URL", "\"${localProps['SUPABASE_URL'] ?: ''}\""
            buildConfigField "String", "SUPABASE_ANON_KEY", "\"${localProps['SUPABASE_ANON_KEY'] ?: ''}\""
            // explícito: initWith copia debug antes de que su bloque asigne la firma LAB
            if (localProps['KEYSTORE_FILE']) { signingConfig signingConfigs.release }
        }
        debug {
            if (localProps['KEYSTORE_FILE']) { signingConfig signingConfigs.release }
        }
        // Prueba interna de Google Play (Orden 21): optimizada, no depurable, contra Supabase QA, sin firma aquí
        // (se firma con la llave de subida). El id definitivo se fija abajo y es permanente una vez subido a Play.
        internal {
            initWith release
            matchingFallbacks = ['release']
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig null
            buildConfigField "String", "API_BASE", "\"\""
            buildConfigField "String", "SUPABASE_URL", "\"${localProps['SUPABASE_URL'] ?: ''}\""
            buildConfigField "String", "SUPABASE_ANON_KEY", "\"${localProps['SUPABASE_ANON_KEY'] ?: ''}\""
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Igual que la app del técnico: kotlin-stdlib-jdk7/8 duplican clases de kotlin-stdlib 1.8+
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// applicationId propio para QA (los build types solo admiten sufijo y daría com.lc.customer.lab.qa)
androidComponents {
    onVariants(selector().withBuildType('qa')) { variant ->
        variant.applicationId.set('com.lc.cliente.qa')
    }
    onVariants(selector().withBuildType('internal')) { variant ->
        variant.applicationId.set('com.lc.cliente')
    }
}
